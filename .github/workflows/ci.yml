name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Third-party JS actions run under Node 24 and their bundled deps emit
  # DEP0040 (punycode) / DEP0169 (url.parse) spam we can't fix; mute it.
  NODE_OPTIONS: --no-deprecation

# `vmem` is a public git dependency (see root Cargo.toml); cargo fetches it
# during the build, so no extra checkout is needed.

jobs:
  build-test:
    name: fmt + clippy + test + bench-compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `--all-features` pulls in the `gui` feature, so eframe's X11/GTK
      # headers must be present even though nothing is rendered here.
      - name: Install system deps (eframe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libfontconfig-dev

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test (all features)
        # ptrace-based tests need an unrestricted ptrace scope.
        run: |
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          cargo test --workspace --all-features

      - name: bench compile-check
        run: cargo bench -p reclass-core --bench engine --no-run

  release-build:
    name: release build (binary + default plugins)
    runs-on: ubuntu-latest
    # The release must not ship an artifact the test job never vetted.
    needs: [build-test]
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (eframe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libfontconfig-dev

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}

      # One cargo invocation, so the host and the plugin bundle are built by
      # the same rustc. The plugin loader compares an ABI fingerprint derived
      # from `rustc --verbose --version` and rejects a mismatch, so a bundle
      # built in a separate job would fail to load.
      - name: Build release binary + default plugins
        run: cargo build --release --package reclass --package reclass-official-plugins

      # Ship the layout the app expects: `plugins/` is resolved next to the
      # binary, so extracting the tarball is the whole install.
      - name: Package
        run: |
          mkdir -p dist/plugins
          cp target/release/reclass dist/
          cp target/release/libreclass_official_plugins.so dist/plugins/
          tar -C dist -czf reclass-linux-x86_64.tar.gz reclass plugins
          sha256sum reclass-linux-x86_64.tar.gz > reclass-linux-x86_64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reclass-linux-x86_64
          path: |
            reclass-linux-x86_64.tar.gz
            reclass-linux-x86_64.tar.gz.sha256

  create-release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-build]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags for the changelog range

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: reclass-linux-x86_64

      - name: Generate changelog
        run: |
          # Previous v* release reachable from HEAD, excluding the current tag.
          prev=$(git tag --list 'v*' --sort=-v:refname --merged HEAD \
                   | grep -vFx "$GITHUB_REF_NAME" | head -n1)
          if [ -n "$prev" ]; then
            printf '## Changes since %s\n\n' "$prev" > /tmp/changelog.md
            range="$prev..HEAD"
          else
            printf '## Changes\n\n' > /tmp/changelog.md
            range=HEAD
          fi
          git log --no-merges --reverse --pretty='* %s' "$range" >> /tmp/changelog.md
          cat >> /tmp/changelog.md <<'MD'

          ## Install

          ```sh
          tar xzf reclass-linux-x86_64.tar.gz
          ./reclass
          ```

          The archive contains the `reclass` binary and the default plugin
          bundle in `plugins/`, which the app loads from next to the binary.
          Both are built by the same toolchain in one step: the loader checks
          an ABI fingerprint and rejects a plugin built by any other, so keep
          the pair together.
          MD
          cat /tmp/changelog.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: true
          body_path: /tmp/changelog.md
          files: |
            reclass-linux-x86_64.tar.gz
            reclass-linux-x86_64.tar.gz.sha256
