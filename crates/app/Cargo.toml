[package]
name = "reclass"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "reclass-rs: a ReClass-style live memory inspector"

[dependencies]
reclass-core = { workspace = true, features = ["rcnet"] }
reclass-backend-vmem = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
serde_json = "1.0.140"
tiny_http = "0.12.0"
eframe = "0.35.0"
egui = "0.35.0"
libloading = "0.9"
parking_lot = "0.12"

[[bin]]
name = "reclass"
path = "src/main.rs"
