[package]
name = "reclass"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "reclass-rs: a ReClass-style live memory inspector"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:libloading", "dep:parking_lot"]

[dependencies]
reclass-core = { workspace = true, features = ["rcnet"] }
reclass-backend-vmem = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
serde_json = "1.0.140"
tiny_http = "0.12.0"
eframe = { version = "0.35.0", optional = true }
egui = { version = "0.35.0", optional = true }
libloading = { version = "0.9", optional = true }
parking_lot = { version = "0.12", optional = true }

[[bin]]
name = "reclass"
path = "src/main.rs"
