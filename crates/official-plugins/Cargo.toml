[package]
name = "reclass-official-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Bundled first-party reclass-rs plugins"

[lib]
crate-type = ["cdylib"]

# Same-toolchain contract: this MUST track the host's `reclass` build exactly.
[dependencies]
reclass = { path = "../app" }
serde = { workspace = true }
serde_json = "1.0.140"
